# Alembic: the Postgres schema for Bee Fit. The database URL comes from DATABASE_URL (app/config.py), never this file.
# Run from backend/:  .venv\Scripts\python.exe -m alembic upgrade head
# (The app also runs "upgrade head" itself at startup: app/db/__init__.py ensure_database.)
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
