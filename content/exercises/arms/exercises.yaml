# PLACEHOLDER exercises: PT TO REVIEW names, instructions, and contraindications.
# id: lowercase_with_underscores; demo media in this folder is named <id>.gif/.mp4/.jpg/.png
# equipment_needed: list from none | mat | dumbbells | resistance_band | chair | bench
# difficulty: beginner | intermediate | advanced
# force: push | pull | static (optional; free-exercise-db's movement direction). Push plan days never
#   get pull moves and Pull days never get push moves. Leave it out for moves with no single direction.
# injury_contraindications: injuries this exercise is UNSAFE for (lower_back | knee | shoulder | wrist | ankle).
#   The app filters these out in code, so be conservative.
# injury_rationale: one entry per tag above, {reasoning, tier, source}. reasoning = why the exercise is commonly
#   avoided with that injury (general exercise-science reasoning, never an invented citation). tier: ai_drafted
#   until a PT confirms it, then pt_reviewed with source set to the PT's name and credentials.
# est_time_seconds: rough time for one set including setup

exercises:
  - id: incline_pushup
    name: Incline Push-Up
    equipment_needed: [chair]
    difficulty: beginner
    force: push
    injury_contraindications: [shoulder, wrist]
    injury_rationale:
      shoulder:
        reasoning: "Push-ups lower and press your body weight through the shoulder joint. Even at an incline, that can aggravate an irritated or recovering shoulder."
        tier: ai_drafted
        source: Pending review by a licensed physical therapist
      wrist:
        reasoning: "Your hands are flat with the wrists bent back under load, a position that commonly bothers sore or injured wrists."
        tier: ai_drafted
        source: Pending review by a licensed physical therapist
    est_time_seconds: 45
    instructions: Hands on a sturdy chair or counter, body in a straight line. Lower your chest to the edge and press back up.
  - id: knee_pushup
    name: Knee Push-Up
    equipment_needed: [mat]
    difficulty: beginner
    force: push
    injury_contraindications: [shoulder, wrist]
    injury_rationale:
      shoulder:
        reasoning: "Even from your knees, the shoulders lower and press a good part of your body weight, which can aggravate an irritated or recovering shoulder."
        tier: ai_drafted
        source: Pending review by a licensed physical therapist
      wrist:
        reasoning: "Your hands are flat on the floor with the wrists bent back under part of your body weight, a position that commonly bothers sore or injured wrists."
        tier: ai_drafted
        source: Pending review by a licensed physical therapist
    est_time_seconds: 45
    instructions: From your knees with a straight line from head to knees, lower your chest toward the floor and press back up.
  - id: dumbbell_bicep_curl
    name: Dumbbell Bicep Curl
    equipment_needed: [dumbbells]
    difficulty: beginner
    force: pull
    injury_contraindications: []
    est_time_seconds: 45
    instructions: Stand tall with elbows at your sides and curl the dumbbells up, then lower slowly without swinging.
  - id: chair_triceps_dip
    name: Chair Triceps Dip
    equipment_needed: [chair]
    difficulty: intermediate
    force: push
    injury_contraindications: [shoulder, wrist]
    injury_rationale:
      shoulder:
        reasoning: "Lowering yourself between your hands on a chair pulls the upper arms back into deep shoulder extension while they hold most of your body weight, which can stress the front of the shoulder joint."
        tier: ai_drafted
        source: Pending review by a licensed physical therapist
      wrist:
        reasoning: "Your hands grip the chair edge with the wrists bent sharply back while they support much of your body weight, which can irritate a sore or injured wrist."
        tier: ai_drafted
        source: Pending review by a licensed physical therapist
    est_time_seconds: 45
    instructions: Hands on the edge of a sturdy chair behind you, bend your elbows to lower your hips, then press back up.
  - id: band_biceps_curl
    name: Resistance Band Biceps Curl
    equipment_needed: [resistance_band]
    difficulty: beginner
    force: pull
    injury_contraindications: []
    est_time_seconds: 45
    instructions: Stand on the band and curl the handles up toward your shoulders, keeping elbows pinned to your sides.
