# PLACEHOLDER exercises: PT TO REVIEW names, instructions, and contraindications.
# id: lowercase_with_underscores; demo media in this folder is named <id>.gif/.mp4/.jpg/.png
# equipment_needed: list from none | mat | dumbbells | resistance_band | chair | bench
# difficulty: beginner | intermediate | advanced
# force: push | pull | static (optional; free-exercise-db's movement direction). Push plan days never
#   get pull moves and Pull days never get push moves. Leave it out for moves with no single direction.
# injury_contraindications: injuries this exercise is UNSAFE for (lower_back | knee | shoulder | wrist | ankle).
#   The app filters these out in code, so be conservative.
# injury_rationale: one entry per tag above, {reasoning, tier, source}. reasoning = why the exercise is commonly
#   avoided with that injury (general exercise-science reasoning, never an invented citation). tier: ai_drafted
#   until a PT confirms it, then pt_reviewed with source set to the PT's name and credentials.
# est_time_seconds: rough time for one set including setup

exercises:
  - id: bird_dog
    name: Bird Dog
    equipment_needed: [mat]
    difficulty: beginner
    force: static
    injury_contraindications: [wrist]
    injury_rationale:
      wrist:
        reasoning: "Being on all fours puts weight through your hands with the wrists bent back, and lifting one arm shifts more of that weight onto the other wrist."
        tier: ai_drafted
        source: Pending review by a licensed physical therapist
    est_time_seconds: 60
    instructions: On hands and knees, extend one arm and the opposite leg straight out while keeping your back flat. Hold briefly, return, and switch sides.
  - id: band_pull_apart
    name: Band Pull-Apart
    equipment_needed: [resistance_band]
    difficulty: beginner
    force: pull
    injury_contraindications: []
    est_time_seconds: 45
    instructions: Hold a band at shoulder height with straight arms and pull it apart by squeezing your shoulder blades together.
  - id: superman_hold
    name: Superman Hold
    equipment_needed: [mat]
    difficulty: beginner
    force: static
    injury_contraindications: [lower_back]
    injury_rationale:
      lower_back:
        reasoning: "Lifting your chest and legs off the floor arches the lower spine and squeezes the low-back muscles hard, which can aggravate a sensitive lower back."
        tier: ai_drafted
        source: Pending review by a licensed physical therapist
    est_time_seconds: 45
    instructions: Lie face down and lift your arms, chest, and legs slightly off the floor. Hold, then lower.
  - id: dumbbell_bent_over_row
    name: Dumbbell Bent-Over Row
    equipment_needed: [dumbbells]
    difficulty: intermediate
    force: pull
    injury_contraindications: [lower_back]
    injury_rationale:
      lower_back:
        reasoning: "Holding a hip hinge while the weights hang in front of you makes the low-back muscles work hard to keep your spine still. If that flat-back position slips under load, it can strain a sensitive lower back."
        tier: ai_drafted
        source: Pending review by a licensed physical therapist
    est_time_seconds: 60
    instructions: Hinge at the hips with a flat back, let the dumbbells hang, then row them toward your hips and lower slowly.
  - id: band_seated_row
    name: Band Seated Row
    equipment_needed: [resistance_band, mat]
    difficulty: beginner
    force: pull
    injury_contraindications: []
    est_time_seconds: 45
    instructions: Sit tall with legs extended and the band around your feet. Pull the handles to your ribs, squeezing your shoulder blades.
