# PLACEHOLDER exercises: PT TO REVIEW names, instructions, and contraindications.
# id: lowercase_with_underscores; demo media in this folder is named <id>.gif/.mp4/.jpg/.png
# equipment_needed: list from none | mat | dumbbells | resistance_band | chair | bench
# difficulty: beginner | intermediate | advanced
# force: push | pull | static (optional; free-exercise-db's movement direction). Push plan days never
#   get pull moves and Pull days never get push moves. Leave it out for moves with no single direction.
# injury_contraindications: injuries this exercise is UNSAFE for (lower_back | knee | shoulder | wrist | ankle).
#   The app filters these out in code, so be conservative.
# injury_rationale: one entry per tag above, {reasoning, tier, source}. reasoning = why the exercise is commonly
#   avoided with that injury (general exercise-science reasoning, never an invented citation). tier: ai_drafted
#   until a PT confirms it, then pt_reviewed with source set to the PT's name and credentials.
# est_time_seconds: rough time for one set including setup

exercises:
  - id: dead_bug
    name: Dead Bug
    equipment_needed: [mat]
    difficulty: beginner
    force: pull
    injury_contraindications: []
    est_time_seconds: 60
    instructions: Lie on your back with arms up and knees bent at 90 degrees. Press your low back into the floor and slowly extend the opposite arm and leg, then switch.
  - id: forearm_plank
    name: Forearm Plank
    equipment_needed: [mat]
    difficulty: beginner
    force: static
    injury_contraindications: [shoulder]
    injury_rationale:
      shoulder:
        reasoning: "Holding your body up on your forearms makes the muscles around the shoulder work continuously to keep the joint steady, which can be too much for an irritated or recovering shoulder."
        tier: ai_drafted
        source: Pending review by a licensed physical therapist
    est_time_seconds: 45
    instructions: Forearms on the floor under your shoulders, body in a straight line from head to heels. Brace your core and hold.
  - id: cat_cow
    name: Cat-Cow
    equipment_needed: [mat]
    difficulty: beginner
    force: static
    injury_contraindications: [wrist]
    injury_rationale:
      wrist:
        reasoning: "You stay on your hands and knees for the whole movement, with the wrists bent back and bearing weight, which can irritate a sore wrist."
        tier: ai_drafted
        source: Pending review by a licensed physical therapist
    est_time_seconds: 45
    instructions: On hands and knees, slowly round your back toward the ceiling, then let it sag gently while lifting your chest. Move with your breath.
  - id: pelvic_tilt
    name: Pelvic Tilt
    equipment_needed: [mat]
    difficulty: beginner
    force: static
    injury_contraindications: []
    est_time_seconds: 45
    instructions: Lie on your back with knees bent. Gently flatten your low back into the floor by tilting your pelvis, hold for a breath, and release.
  - id: crunch
    name: Crunch
    equipment_needed: [mat]
    difficulty: beginner
    force: pull
    injury_contraindications: [lower_back]
    injury_rationale:
      lower_back:
        reasoning: "Crunches repeatedly curl the spine forward. Many people with a sensitive lower back find repeated forward bending makes it worse."
        tier: ai_drafted
        source: Pending review by a licensed physical therapist
    est_time_seconds: 45
    instructions: Lie on your back with knees bent and curl your shoulders off the floor, then lower with control.
