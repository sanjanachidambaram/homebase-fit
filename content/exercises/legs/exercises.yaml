# PLACEHOLDER exercises: PT TO REVIEW names, instructions, and contraindications.
# id: lowercase_with_underscores; demo media in this folder is named <id>.gif/.mp4/.jpg/.png
# equipment_needed: list from none | mat | dumbbells | resistance_band | chair | bench
# difficulty: beginner | intermediate | advanced
# force: push | pull | static (optional; free-exercise-db's movement direction). Push plan days never
#   get pull moves and Pull days never get push moves. Leave it out for moves with no single direction.
# injury_contraindications: injuries this exercise is UNSAFE for (neck | shoulder | upper_back | lower_back | wrist | hip | knee | ankle).
#   The app filters these out in code, so be conservative.
# injury_rationale: one entry per tag above, {reasoning, tier, source}. reasoning = why the exercise is commonly
#   avoided with that injury (general exercise-science reasoning, never an invented citation). tier: ai_drafted
#   until a PT confirms it, then pt_reviewed with source set to the PT's name and credentials.
# est_time_seconds: rough time for one set including setup

exercises:
  - id: bodyweight_squat
    name: Bodyweight Squat
    equipment_needed: [none]
    difficulty: beginner
    force: push
    injury_contraindications: [hip, knee]
    injury_rationale:
      knee:
        reasoning: "Squatting bends the knees while they carry your body weight, and deep or repeated bending can aggravate a sore or recovering knee."
        tier: ai_drafted
        source: Pending review by a licensed physical therapist
      hip:
        reasoning: "Squatting takes the hips through a deep bend under your body weight, which can pinch or aggravate a sore or recovering hip."
        tier: ai_drafted
        source: Pending review by a licensed physical therapist
    est_time_seconds: 45
    instructions: Feet shoulder-width apart, sit hips back and down until thighs are near parallel, then stand up through your heels.
  - id: reverse_lunge
    name: Reverse Lunge
    equipment_needed: [none]
    difficulty: beginner
    force: push
    injury_contraindications: [hip, knee, ankle]
    injury_rationale:
      knee:
        reasoning: "Lunges load one knee at a time through a deep bend, which can aggravate a sore knee."
        tier: ai_drafted
        source: Pending review by a licensed physical therapist
      ankle:
        reasoning: "Stepping back and balancing on one leg challenges the ankle's stability, which can be risky for an ankle that's sprained or still recovering."
        tier: ai_drafted
        source: Pending review by a licensed physical therapist
      hip:
        reasoning: "Lunging loads one hip at a time through a deep bend while you balance, which can aggravate a sore or recovering hip."
        tier: ai_drafted
        source: Pending review by a licensed physical therapist
    est_time_seconds: 60
    instructions: Step one foot back and lower until both knees are bent about 90 degrees, then push through the front heel to return. Alternate sides.
  - id: glute_bridge
    name: Glute Bridge
    equipment_needed: [mat]
    difficulty: beginner
    force: push
    injury_contraindications: []
    est_time_seconds: 45
    instructions: Lie on your back with knees bent and feet flat. Squeeze your glutes to lift your hips until your body forms a straight line from shoulders to knees, then lower slowly.
  - id: wall_sit
    name: Wall Sit
    equipment_needed: [none]
    difficulty: beginner
    force: static
    injury_contraindications: [knee]
    injury_rationale:
      knee:
        reasoning: "Holding your knees bent at about 90 degrees keeps steady pressure on the knee joint, including behind the kneecap, which can aggravate a sore knee."
        tier: ai_drafted
        source: Pending review by a licensed physical therapist
    est_time_seconds: 45
    instructions: Slide down a wall until your knees are bent about 90 degrees and hold, keeping your back flat against the wall.
  - id: side_lying_leg_raise
    name: Side-Lying Leg Raise
    equipment_needed: [mat]
    difficulty: beginner
    injury_contraindications: [hip]
    injury_rationale:
      hip:
        reasoning: "Lifting the top leg works the muscles around the hip directly, and lying on your side presses on the lower hip, so either side can be uncomfortable for a sore hip."
        tier: ai_drafted
        source: Pending review by a licensed physical therapist
    est_time_seconds: 60
    instructions: Lie on your side with legs straight. Lift the top leg about 45 degrees without rolling your hips back, then lower with control.
  - id: goblet_squat
    name: Dumbbell Goblet Squat
    equipment_needed: [dumbbells]
    difficulty: intermediate
    force: push
    injury_contraindications: [lower_back, hip, knee]
    injury_rationale:
      knee:
        reasoning: "A weighted squat loads the knees through a deep bend."
        tier: ai_drafted
        source: Pending review by a licensed physical therapist
      lower_back:
        reasoning: "Holding a weight at your chest adds load that your back muscles must resist to keep you upright, which can strain a sensitive lower back if your posture slips."
        tier: ai_drafted
        source: Pending review by a licensed physical therapist
      hip:
        reasoning: "Holding a weight while you squat adds load to the hips at the bottom of a deep bend, which can aggravate a sore hip."
        tier: ai_drafted
        source: Pending review by a licensed physical therapist
    est_time_seconds: 60
    instructions: Hold one dumbbell at your chest, squat down keeping your chest tall and elbows inside your knees, then stand.
