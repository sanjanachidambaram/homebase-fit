citations: []
description: >
  Three low-impact sessions a week that keep your heart rate up while
  strengthening the muscles that support your lower back. No jumping, no
  loaded spinal bending.
science_rationale: >
  PT TO REPLACE. Placeholder text: core stabilization work (dead bug, bird
