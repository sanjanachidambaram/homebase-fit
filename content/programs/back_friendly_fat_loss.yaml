# PLACEHOLDER PROGRAM: PT TO REPLACE the rationale and review every exercise.
# Flagship use case: weight loss + lower back rehab at the same time.
#
# Fields:
#   name           shown to users; must be unique across programs
#   goal_tags      any of weight_loss | tone | strength | rehab (matches quiz goals)
#   injury_focus   injuries this program is built to be safe for (lower_back | knee | shoulder).
#                  The seed refuses to load a program that uses an exercise
