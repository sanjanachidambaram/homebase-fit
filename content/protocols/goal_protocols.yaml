# =====================================================================
# GOAL PROTOCOLS: the training parameters behind every generated plan.
# PLACEHOLDER VALUES: PT / OB-GYN TO REVIEW every row and add real citations.
# =====================================================================
# One row per goal x experience level (3 goals x 3 levels = 9 rows; the seed checks they're all here).
# The program generator (backend/app/services/program_generator.py) reads these; it never invents sets, reps, rest
# or session length itself. After editing, rebuild from backend/:
#   .venv\Scripts\python.exe -m app.db.seed
#
# What is NOT here, because it's fixed by the plan design (backend/prompts/shared_rules.md, rule 6):
#   the week structure (always 4 training days: Getting stronger = 3 strength + 1 cardio; Losing weight =
#   2 strength + 2 cardio; Feeling good = 2 mobility/core + 1 strength + 1 cardio), how weeks repeat (2-, 4- and
#   8-week blocks), the default starting weights, and how weights go up (rule 8).
#
# Fields:
#   goal                    stronger | lose_weight | feel_good
#   experience_level        beginner | intermediate | advanced
#   session_length_minutes  15-60: the time budget every training day is filled to
#   sets_range, reps_range  "low-high" (or one number), e.g. "2-3", "12-15". For Getting stronger the reps are the
#                           person's own call during each set ("to failure" is their judgment, not the app's); the
#                           range is shown only as a rough guide.
#   rest_seconds            rest between sets on strength days
#   progression_note        shown with the plan
#   status                  placeholder | pt_reviewed (pt_reviewed requires at least one citation)
#   citations               list of { claim, source }. PT TO FILL IN.
#
# These numbers are placeholders chosen to be conservative. They are NOT presented to users as scientific fact:
# the app labels every placeholder row "Content pending expert review".

protocols:
  # ---------------------------------------------------------------- Getting stronger
  - goal: stronger
    experience_level: beginner
    session_length_minutes: 40
    sets_range: "2-3"
    reps_range: "8-12"
    rest_seconds: 90
    progression_note: The weight goes up each time a day repeats; how many reps you do is your call.
    status: placeholder
    citations: []

  - goal: stronger
    experience_level: intermediate
    session_length_minutes: 45
    sets_range: "3"
    reps_range: "6-10"
    rest_seconds: 120
    progression_note: The weight goes up each time a day repeats; how many reps you do is your call.
    status: placeholder
    citations: []

  - goal: stronger
    experience_level: advanced
    session_length_minutes: 60
    sets_range: "3-4"
    reps_range: "5-8"
    rest_seconds: 150
    progression_note: The weight goes up each time a day repeats; how many reps you do is your call.
    status: placeholder
    citations: []

  # ---------------------------------------------------------------- Losing weight
  - goal: lose_weight
    experience_level: beginner
    session_length_minutes: 30
    sets_range: "2-3"
    reps_range: "12-15"
    rest_seconds: 30
    progression_note: Weights go up 5 lb every 4 weeks, when the 4-week pattern starts again.
    status: placeholder
    citations: []

  - goal: lose_weight
    experience_level: intermediate
    session_length_minutes: 40
    sets_range: "3"
    reps_range: "12-15"
    rest_seconds: 30
    progression_note: Weights go up 5 lb every 4 weeks, when the 4-week pattern starts again.
    status: placeholder
    citations: []

  - goal: lose_weight
    experience_level: advanced
    session_length_minutes: 45
    sets_range: "3-4"
    reps_range: "10-15"
    rest_seconds: 30
    progression_note: Weights go up 5 lb every 4 weeks, when the 4-week pattern starts again.
    status: placeholder
    citations: []

  # ---------------------------------------------------------------- Just feeling good in my body
  - goal: feel_good
    experience_level: beginner
    session_length_minutes: 20
    sets_range: "2-3"
    reps_range: "10-12"
    rest_seconds: 45
    progression_note: Weights stay wherever you set them; the 8-week pattern keeps things varied.
    status: placeholder
    citations: []

  - goal: feel_good
    experience_level: intermediate
    session_length_minutes: 25
    sets_range: "2-3"
    reps_range: "10-12"
    rest_seconds: 45
    progression_note: Weights stay wherever you set them; the 8-week pattern keeps things varied.
    status: placeholder
    citations: []

  - goal: feel_good
    experience_level: advanced
    session_length_minutes: 30
    sets_range: "3"
    reps_range: "10-12"
    rest_seconds: 45
    progression_note: Weights stay wherever you set them; the 8-week pattern keeps things varied.
    status: placeholder
    citations: []
