    status: placeholder
    citations: []
  - goal: rehab
    experience_level: advanced
    sessions_per_week: 4
    session_length_minutes: 30
    split_type: full_body
    sets_range: "2-3"
    reps_range: "10-15"
    rest_seconds: 60
