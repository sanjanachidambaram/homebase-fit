# =====================================================================
# HomeBase Fit onboarding quiz (placeholder wording: review before launch).
# =====================================================================
# After editing, rebuild the database from backend/:
#   .venv\Scripts\python.exe -m app.db.seed
#
# Each question:
#   id               stable key; maps to a quiz_profiles column (app/users.py), so don't rename ids
#   prompt           the question shown to the user
#   type             multi_select | single_select | number | text | date
#   options          (select types) list of {value, label, description?}; value is what's stored.
#                    description is a short plain-language line shown under the option.
#   help_text        (optional) a line shown under the question
#   exclusive        (multi_select, optional) a value that clears all others, e.g. "none"
#   always_included  (multi_select, optional) a value that is always on and can't be unticked
#   allow_free_text  (optional) also show a text box under the options (stored, never sent to the AI)
#   unit, min, max   (number types, optional)
#   ask_if           (optional) {question: <id>, equals: <value>}: only asked (and only stored) when that answer
#                    matches. Otherwise it's skipped, never required, and saved as empty.
#   required         true/false (when asked)
#   health           true = health/injury question. Only shown AFTER the user accepts the medical
#                    disclaimer, so keep this flag on every health question.
#
# Values the program generator relies on (app/services/program_generator.py):
#   goal:             stronger | lose_weight | feel_good (must match goal_protocols.yaml)
#   experience_level: beginner | intermediate | advanced (also picks the default starting weights)
#   injuries:         neck | shoulder | upper_back | lower_back | wrist | hip | knee | ankle (must match exercise injury tags)
#   equipment:        bodyweight | dumbbells | kettlebells | resistance_band | mat | full_gym

questions:
  # ---------------------------------------------------------------- general (before the disclaimer)
  - id: goal
    prompt: What's your main fitness goal?
    type: single_select
    required: true
    help_text: Pick the one that matters most right now. You can retake the quiz any time.
    options:
      - { value: stronger,    label: Getting stronger,                description: "3 strength days and 1 cardio day a week. Each day works either your upper or lower body, and the weights go up as you go." }
      - { value: lose_weight, label: Losing weight,                   description: "2 strength days and 2 cardio days a week, in a 4-week pattern that repeats a little heavier." }
      - { value: feel_good,   label: Just feeling good in my body,    description: "2 mobility and core days, 1 strength day and 1 cardio day a week, in a gentle 8-week pattern." }

  - id: experience_level
    prompt: How much strength training have you done?
    type: single_select
    required: true
    help_text: This sets your suggested starting weights. You can always change them.
    options:
      - { value: beginner,     label: Just starting out,   description: "New to strength training, or coming back after a long break (6+ months)." }
      - { value: intermediate, label: Some experience,     description: "You've trained fairly regularly for 6+ months and know the basic moves." }
      - { value: advanced,     label: Very experienced,    description: "You've trained consistently for 2+ years and are confident with heavier loads." }

  - id: equipment
    prompt: What equipment do you have?
    type: multi_select
    required: true
    always_included: bodyweight
    help_text: Bodyweight moves are always included.
    options:
      - { value: bodyweight,      label: Bodyweight (always included) }
      - { value: dumbbells,       label: Dumbbells }
      - { value: kettlebells,     label: Kettlebell }
      - { value: resistance_band, label: Resistance bands }
      - { value: mat,             label: Exercise mat }
      - { value: full_gym,        label: A full gym }

  # ---------------------------------------------------------------- health (after the disclaimer)
  - id: injuries
    health: true
    prompt: Any injuries or areas that need extra care?
    type: multi_select
    required: true
    exclusive: none
    allow_free_text: true
    free_text_prompt: Anything else we should know? (optional)
    options:
      - { value: neck,       label: Neck }
      - { value: shoulder,   label: Shoulder }
      - { value: upper_back, label: Upper back }
      - { value: lower_back, label: Lower back }
      - { value: wrist,      label: Wrist }
      - { value: hip,        label: Hip }
      - { value: knee,       label: Knee }
      - { value: ankle,      label: Ankle }
      - { value: none,       label: None }

  - id: pregnancy_status
    health: true
    prompt: Are you currently pregnant or postpartum?
    type: single_select
    required: true
    help_text: >
      Exercise during pregnancy and after giving birth needs guidance from a clinician. Our pregnancy and
      postpartum guidance is still waiting on review by an OB-GYN, so for now we won't generate a plan for
      these answers. Please talk with your OB-GYN or midwife.
    options:
      - { value: none,       label: Neither }
      - { value: pregnant,   label: Pregnant }
      - { value: postpartum, label: Postpartum, description: "You've had a baby in the past year." }

  - id: weight
    health: true
    ask_if: { question: goal, equals: lose_weight }
    prompt: What is your current weight?
    type: number
    unit: lb
    min: 60
    max: 700
    required: true

  - id: goal_weight
    health: true
    ask_if: { question: goal, equals: lose_weight }
    prompt: What's your goal weight?
    type: number
    unit: lb
    min: 60
    max: 700
    required: false
    help_text: Optional. There's no deadline to pick; we'll just show you what a gradual pace looks like.
    # A gentle, cited note shown under the answer (never a block): how long the change takes at a gradual pace.
    pace_note:
      lbs_per_week: [1, 2]
      text: >
        People who lose weight gradually, about 1 to 2 pounds a week, are more likely to keep it off.
      source: "CDC, Losing Weight: https://www.cdc.gov/healthy-weight-growth/losing-weight/index.html"
