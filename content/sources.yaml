# SOURCE REGISTRY: the authoritative list of where HomeBase Fit's content comes from.
# Served at GET /api/sources and shown in the site's "Data & Sources" footer.
#
# Add an entry whenever real content arrives, then point that content at it:
#   exercises   source_dataset is set per folder by the seed
#   programs    `source:` field in content/programs/*.yaml
#   articles    `source:` field in the front matter of content/basics/*.md
# Then rerun the seed (from backend/): .venv\Scripts\python.exe -m app.db.seed
#
# Fields:
#   id        stable key that content refers to (never change it once used)
#   name      shown on the site
#   url       link shown on the site (optional)
#   license   license or permission terms
#   used_for  what in the app comes from this source
#   status    active (real content in use) | placeholder (stand-in content in use)
#             | pending (promised, not received yet)

sources:
  - id: free-exercise-db
    name: Free Exercise DB
    url: https://github.com/yuhonas/free-exercise-db
    license: The Unlicense (public domain)
    used_for: Exercise library (876 exercises) and demo images
    status: active

  - id: placeholder-authored
    name: HomeBase Fit placeholder content (AI-drafted)
    url:
    license: Project content; not yet professionally reviewed
    used_for: 27 starter exercises (with drafted injury tags), 15 goal protocols, and 5 Workout Basics articles, all pending PT review
    status: placeholder

  - id: pt-reviewed-protocols
    name: PT-reviewed goal protocols
    url:
    license: Pending; terms to be confirmed with the PT
    used_for: The training parameters behind every generated plan (replacing the placeholder protocols)
    status: pending

  - id: obgyn-pregnancy-guidance
    name: OB-GYN-reviewed pregnancy and postpartum guidance
    url:
    license: Pending; terms to be confirmed with the reviewer
    used_for: Plans for pregnant and postpartum users (no plan is generated for them until this exists)
    status: pending

  - id: pt-obgyn-reviewed-basics
    name: PT/OB-GYN-reviewed Workout Basics articles
    url:
    license: Pending; terms to be confirmed with the reviewers
    used_for: Workout Basics hub articles (replacing the placeholders)
    status: pending

  - id: cdc-losing-weight
    name: "CDC: Losing Weight"
    url: https://www.cdc.gov/healthy-weight-growth/losing-weight/index.html
    license: U.S. government work (public domain)
    used_for: The quiz note that losing about 1 to 2 pounds a week is more sustainable, and the same context next to the Workout Reviewer's weight-change estimate, and the "Tracking Weight Loss" Workout Basics article
    status: active

  - id: acog-co-804
    name: "ACOG Committee Opinion No. 804: Physical Activity and Exercise During Pregnancy and the Postpartum Period (2020)"
    url: https://www.acog.org/clinical/clinical-guidance/committee-opinion/articles/2020/04/physical-activity-and-exercise-during-pregnancy-and-the-postpartum-period
    license: Cited by link only (American College of Obstetricians and Gynecologists; Obstet Gynecol 2020;135:e178-e188)
    used_for: Why pregnant and postpartum users are sent to their own clinician instead of a generated plan (the pregnancy support page)
    status: active

  - id: compendium-physical-activities
    name: "2024 Adult Compendium of Physical Activities (Herrmann SD et al., J Sport Health Sci 2024;13(1):6-12)"
    url: https://pacompendium.com/conditioning-exercise/
    license: Cited by link (published MET values; DOI 10.1016/j.jshs.2023.10.010)
    used_for: "The Workout Reviewer's calorie estimate range: MET 3.5 (code 02054, resistance training, 8-15 reps) to MET 7.5 (code 02020, vigorous calisthenics), with 1 MET = about 1 kcal per kg per hour"
    status: active
