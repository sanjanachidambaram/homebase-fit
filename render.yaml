# Render Blueprint for Bee Fit: ONE web service ("bee-fit") that serves the API, the media in content/, and the built
# React app (FastAPI serves frontend/dist; there is no separate frontend service). Replaces the old "homebase-fit"
# service name (2026-10-25). Python and Node versions are pinned by .python-version (3.13) and .node-version (24) in
# the repo root.
#
# Secrets are NOT in this file: each `sync: false` variable is asked for in the Render dashboard the first time the
# Blueprint is created (see README.md, "Deployment"). Only non-secret values are written here.
#
# Free plan, no disk: every account and all user data live in Postgres at DATABASE_URL (a free Neon database), so
# nothing on the instance's own filesystem needs to survive a deploy or restart. On startup the app brings the schema
# up to date (Alembic migrations in backend/migrations) and loads the content from content/ when a deploy ships new
# content, never touching accounts (backend/app/db/__init__.py: ensure_database).
#
# --forwarded-allow-ips '*': Render's proxy sits in front of the app, so the person's IP arrives in X-Forwarded-For.
# Trusting it lets the sign-in rate limits count per person instead of lumping everyone under the proxy's address,
# and lets the app see that requests came in over https.
services:
  - type: web
    name: bee-fit
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && cd frontend && npm ci && npm run build
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /api/health
    envVars:
      # All read by the app (backend/app/config.py, app/db, app/oauth.py, app/agents/harness.py).
      - key: APP_ENV          # enter: production
        sync: false
      - key: APP_SECRET_KEY   # enter: a long random string (signs sign-in tokens and the OAuth state cookie)
        sync: false
      - key: DATABASE_URL     # required: the Neon connection string (postgresql://...?sslmode=require)
        sync: false
      - key: PUBLIC_BASE_URL  # not a secret: the service's public address; OAuth redirect URIs are built from it
        value: https://bee-fit-app.onrender.com
      - key: GOOGLE_CLIENT_ID         # required for "Continue with Google" (the button is hidden without it)
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID      # required for "Continue with Microsoft" (the button is hidden without it)
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: PORTKEY_API_KEY  # enter: the course Portkey key (or leave blank to run with the AI features off)
        sync: false
